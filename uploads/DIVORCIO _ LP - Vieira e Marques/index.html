<body style="margin:0; background:#0B0B0B; color:#EDEDED; font-family:'Lexend Deca',Helvetica,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; padding:80px 24px;">

  <div style="text-align:center; max-width:620px;">

  </div>

  <div style="display:flex; flex-wrap:wrap; gap:16px; justify-content:center;">

  <script src="wa-flutuante.js"></script>
  <script>

      origemForm: 'lp-exemplo',
